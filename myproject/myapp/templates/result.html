{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Datas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body{
            background: linear-gradient(to right,#fbc2eb,#a6c1ee);
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
        }
        .main-box{
            width: 95%;
            margin: auto;
            padding-top: 40px;
        }
        h1{
            text-align: center;
            color: darkblue;
            font-size: 50px;
            font-weight: bold;
            margin-bottom: 35px;
        }
        .table-box{
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0px 0px 20px rgba(0,0,0,0.2);
            overflow-x: auto;
        }
        table{
            width: 100%;
            border-collapse: collapse;
        }
        th{
            background: #0d1b8c;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 18px;
        }
        td{
            padding: 14px;
            text-align: center;
            border-bottom: 1px solid #ddd;
            font-size: 16px;
        }
        tr:hover{
            background: #f2f2f2;
            transition: 0.3s;
        }
        .edit-btn{
            background: green;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 8px;
            font-weight: bold;
        }
        .edit-btn:hover{
            background: darkgreen;
        }
        .top-links{
            text-align: center;
            margin-bottom: 25px;
        }
        .top-links a{
            text-decoration: none;
            background: white;
            padding: 10px 18px;
            border-radius: 10px;
            margin: 5px;
            color: darkblue;
            font-weight: bold;
            box-shadow: 0px 0px 8px rgba(0,0,0,0.1);
        }
        .top-links a:hover{
            background: darkblue;
            color: white;
            transition: 0.3s;
        }
    </style>
</head>
<body>
<div class="main-box">
    <div class="top-links">
        <a href="{% url 'index' %}">Home</a>
        <a href="{% url 'stdform' %}">Add Student</a>
        <a href="{% url 'about' %}">About</a>
        <a href="{% url 'contact' %}">Contact</a>
    </div>
    <h1>Student Datas</h1>
    <div class="table-box">
        <table>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Gender</th>
                <th>Department</th>
                <th>Address</th>
                <th>Action</th>
            </tr>
            {% for i in result %}
            <tr>
                <td>{{ i.id }}</td>
                <td>{{ i.name }}</td>
                <td>{{ i.email }}</td>
                <td>{{ i.phone }}</td>
                <td>{{ i.gender }}</td>
                <td>{{ i.department }}</td>
                <td>{{ i.address }}</td>
                <td>
                    <a href="{% url 'edit' i.id %}" class="edit-btn">
                        <button>Edit</button>
                        <a href="{% url 'delete' i.id %}" class="edit-btn">
                        <button>delete</button>
                    </a>
                </td>
            </tr>
            {% endfor %}
        </table>
    </div>
</div>
</body>
</html>
