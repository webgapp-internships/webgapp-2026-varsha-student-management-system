<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Menu</title>

    <!-- Bootstrap Link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-danger">
        <div class="container">
            <a class="navbar-brand" href="#">Foodie</a>

            <div>
                <a class="btn btn-light me-2" href="index.html">Home</a>
                <a class="btn btn-light me-2" href="menu.html">Menu</a>
                <a class="btn btn-light" href="contact.html">Contact</a>
            </div>
        </div>
    </nav>

    <!-- Menu Section -->
    <div class="container mt-5">

        <h1 class="text-center mb-4">Our Special Foods</h1>

        <div class="row">

            <div class="col-md-4">
                <div class="card shadow">
                    <img src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38"
                         class="card-img-top">

                    <div class="card-body text-center">
                        <h3>Pizza</h3>
                        <p>Cheesy and delicious pizza</p>
                        <button class="btn btn-danger">Order Now</button>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card shadow">
                    <img src="https://images.unsplash.com/photo-1550547660-d9450f859349"
                         class="card-img-top">

                    <div class="card-body text-center">
                        <h3>Burger</h3>
                        <p>Tasty crispy burger</p>
                        <button class="btn btn-danger">Order Now</button>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card shadow">
                    <img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c"
                         class="card-img-top">

                    <div class="card-body text-center">
                        <h3>Salad</h3>
                        <p>Healthy fresh salad</p>
                        <button class="btn btn-danger">Order Now</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
